/* ============ 宽带商机 · 网格作战台 ============ */
:root{
  --bg:#070D18; --bg2:#0A1322; --surface:#101C2F; --surface2:#15243B;
  --surface3:#1B2E49; --line:rgba(126,170,235,.14); --line2:rgba(126,170,235,.24);
  --text:#E9F1FF; --text2:#AEC1DC; --muted:#7187A6; --faint:#4C6080;
  --blue:#3D8BFF; --blue2:#6EABFF; --cyan:#37E1C0; --amber:#FFBE55;
  --red:#FF7568; --purple:#B08CFF; --green:#4ADE80;
  --op-mobile:#3D8BFF; --op-unicom:#FF7A6A; --op-telecom:#2FD3AE; --op-broadcast:#B08CFF;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sh:0 10px 30px rgba(0,0,0,.34);
}
*{box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation; /* ✅ 修复安卓WebView点击卡顿、点击失效 */}
html,body{height:100%;margin:0}
body{
  font-family:var(--font); color:var(--text); background:var(--bg);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{outline:none;border:0;background:none;width:100%}
::-webkit-scrollbar{width:0;height:0}

/* 桌面展示背景 */
.desk-glow{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(900px 620px at 22% 8%,rgba(48,110,220,.16),transparent 62%),
             radial-gradient(760px 560px at 88% 92%,rgba(24,190,168,.10),transparent 60%),
             linear-gradient(180deg,#080F1C,#050A13);}
.desk-glow:after{content:"";position:absolute;inset:0;opacity:.34;
  background-image:linear-gradient(rgba(120,170,235,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,235,.055) 1px,transparent 1px);
  background-size:44px 44px;mask-image:linear-gradient(90deg,#000,transparent 42%,transparent 58%,#000)}
.desk-side{position:fixed;left:6.5vw;top:50%;transform:translateY(-50%);width:320px;display:none;z-index:2}
.desk-brand{display:flex;align-items:center;gap:14px}
.desk-mark{font-size:38px;color:var(--blue);text-shadow:0 0 26px rgba(61,139,255,.7)}
.desk-title{font-size:30px;font-weight:800;letter-spacing:.16em}
.desk-sub{font-family:var(--mono);font-size:10px;letter-spacing:.28em;color:var(--muted);margin-top:6px}
.desk-desc{font-size:13px;line-height:2;color:var(--text2);margin:26px 0 30px;letter-spacing:.02em}
.desk-meta{display:flex;gap:8px;flex-wrap:wrap}
.desk-meta span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--cyan);border:1px solid rgba(55,225,192,.3);padding:6px 9px;border-radius:4px}
@media(min-width:980px){.desk-side{display:block}}

/* 手机外壳 */
.app-shell{position:relative;z-index:3;width:100%;max-width:440px;height:100dvh;margin:0 auto;
  background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 0 1px rgba(126,170,235,.13),0 40px 100px rgba(0,0,0,.6);}
@media(min-width:520px){.app-shell{height:min(920px,94dvh);margin-top:3dvh;border-radius:34px;
  border:1px solid rgba(126,170,235,.2)}.app-shell:before{content:"";position:absolute;inset:0;border-radius:34px;
  background:radial-gradient(600px 300px at 80% -10%,rgba(61,139,255,.12),transparent 70%);pointer-events:none;z-index:0}}

/* 状态栏 */
.statusbar{height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-family:var(--mono);font-size:12px;font-weight:600;position:relative;z-index:5;color:var(--text)}
.sb-notch{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:86px;height:22px;border-radius:12px;background:#03070E}
.sb-right{display:flex;align-items:center;gap:6px}
.sb-bat{width:20px;height:10px;border:1.3px solid currentColor;border-radius:3px;position:relative;display:inline-flex;padding:1.4px}
.sb-bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0}
.sb-bat i{display:block;width:78%;background:currentColor;border-radius:1px}

/* 内容区 */
.app-main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1;scroll-behavior:smooth}
.view{display:none;padding:0 16px 116px;animation:viewIn .34s cubic-bezier(.2,.8,.25,1) both}
.view.active{display:block}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stagger>*{animation:cardIn .5s cubic-bezier(.2,.8,.25,1) both}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.07s}
.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.17s}
.stagger>*:nth-child(5){animation-delay:.22s}.stagger>*:nth-child(6){animation-delay:.27s}
.stagger>*:nth-child(7){animation-delay:.32s}.stagger>*:nth-child(8){animation-delay:.37s}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* 页头 */
.page-head{padding:14px 2px 18px;display:flex;align-items:flex-end;justify-content:space-between}
.page-head .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--cyan);margin-bottom:8px}
.page-head h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.02em}
.page-head .sub{font-size:11.5px;color:var(--muted);margin-top:7px}
.head-badge{font-family:var(--mono);font-size:10px;color:var(--text2);border:1px solid var(--line);background:rgba(20,36,58,.6);padding:7px 10px;border-radius:8px;white-space:nowrap}
.brandbar{display:flex;align-items:center;gap:10px;padding:16px 2px 4px}
.brand-logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(140deg,var(--blue),#1D5FD0);display:grid;place-items:center;box-shadow:0 4px 16px rgba(61,139,255,.36)}
.brand-logo svg{width:19px;height:19px}
.brand-name{font-size:14px;font-weight:700;letter-spacing:.04em}
.brand-sub{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--muted);margin-top:3px}

/* 卡片 */
.card{background:linear-gradient(160deg,rgba(23,40,64,.92),rgba(14,26,44,.94));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.card + .card{margin-top:12px}
.card.pad0{padding:0}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.card-title:before{content:"";width:3px;height:13px;border-radius:2px;background:var(--blue);box-shadow:0 0 10px rgba(61,139,255,.7)}
.card-extra{font-family:var(--mono);font-size:10px;color:var(--muted)}
.sec-gap{height:14px}

/* 数字 */
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.045em;font-weight:700}
.hero-num{font-size:46px;line-height:1;background:linear-gradient(180deg,#fff,#8FB9FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.unit{font-size:12px;color:var(--muted);font-family:var(--font);font-weight:500;letter-spacing:0}
.trend-up{color:var(--cyan);font-family:var(--mono);font-size:11px}
.trend-down{color:var(--red);font-family:var(--mono);font-size:11px}

/* Hero */
.hero{background:radial-gradient(420px 200px at 90% -20%,rgba(61,139,255,.34),transparent 65%),linear-gradient(150deg,#172C4C,#0D1B2F);border:1px solid rgba(61,139,255,.3)}
.hero:after{content:"";position:absolute;right:-30px;bottom:-60px;width:180px;height:180px;border:1px solid rgba(126,170,235,.09);border-radius:50%;box-shadow:0 0 0 26px rgba(126,170,235,.035),0 0 0 54px rgba(126,170,235,.02)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start}
.hero-label{font-size:11px;color:var(--text2);letter-spacing:.08em}
.hero-chip{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--cyan);background:rgba(55,225,192,.1);border:1px solid rgba(55,225,192,.28);padding:5px 8px;border-radius:5px}
.hero-row{display:flex;align-items:flex-end;gap:10px;margin:16px 0 6px}
.hero-foot{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.hero-spark{position:absolute;right:16px;bottom:16px;opacity:.85}

/* KPI 网格 */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px;position:relative;overflow:hidden}
.kpi .k-label{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.kpi .k-val{font-family:var(--mono);font-size:25px;font-weight:700;letter-spacing:-.04em;margin-top:9px;font-variant-numeric:tabular-nums}
.kpi .k-foot{font-size:9.5px;color:var(--faint);margin-top:5px}
.kpi .k-ico{position:absolute;right:11px;top:11px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:rgba(61,139,255,.1);color:var(--blue2)}
.kpi .k-ico svg{width:13px;height:13px}
.kpi.c2 .k-ico{background:rgba(255,190,85,.1);color:var(--amber)}
.kpi.c3 .k-ico{background:rgba(55,225,192,.1);color:var(--cyan)}
.kpi.c4 .k-ico{background:rgba(176,140,255,.1);color:var(--purple)}

/* 分布条 */
.stack-bar{height:9px;border-radius:6px;overflow:hidden;display:flex;background:rgba(255,255,255,.05);gap:2px}
.stack-bar i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.8,.25,1)}
.legend{display:flex;flex-wrap:wrap;gap:9px 14px;margin-top:13px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text2)}
.legend-dot{width:7px;height:7px;border-radius:2px;flex:none}
.legend-item b{font-family:var(--mono);color:var(--text);font-weight:600}

/* 快捷操作 */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-btn{border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:14px;display:flex;align-items:center;gap:11px;text-align:left;transition:transform .16s,border-color .16s}
.quick-btn:active{transform:scale(.97)}
.quick-btn.primary{background:linear-gradient(135deg,rgba(61,139,255,.22),rgba(61,139,255,.08));border-color:rgba(61,139,255,.42)}
.quick-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(61,139,255,.16);color:var(--blue2);flex:none}
.quick-ico svg{width:17px;height:17px}
.quick-t{font-size:12.5px;font-weight:700}
.quick-s{font-size:9.5px;color:var(--muted);margin-top:3px}

/* 营销计划 */
.plan-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.plan-row:last-child{border-bottom:0;padding-bottom:2px}
.plan-row:first-child{padding-top:2px}
.plan-tag{font-size:10px;padding:5px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.plan-row .p-name{font-size:12px;flex:1}
.plan-row .p-count{font-family:var(--mono);font-size:17px;font-weight:700}

/* 线索卡片 */
.search-row{display:flex;gap:9px;margin-bottom:12px}
.search-box{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 12px;height:42px}
.search-box svg{width:15px;height:15px;color:var(--muted);flex:none}
.search-box input{font-size:12.5px}
.search-box input::placeholder{color:var(--faint)}
.filter-btn{width:42px;height:42px;flex:none;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--text2)}
.filter-btn svg{width:17px;height:17px}
.filter-btn.on{border-color:var(--blue);color:var(--blue2);background:rgba(61,139,255,.12)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{flex:none;font-size:11px;padding:7px 12px;border-radius:20px;border:1px solid var(--line);color:var(--muted);background:rgba(16,28,47,.7);white-space:nowrap;transition:.16s}
.chip.on{background:rgba(61,139,255,.16);border-color:rgba(61,139,255,.5);color:#BBD6FF;font-weight:600}
.filter-panel{margin-bottom:12px}
.fp-label{font-size:10px;color:var(--muted);margin:10px 0 7px;letter-spacing:.06em}

.lead-card{background:linear-gradient(150deg,rgba(23,40,64,.85),rgba(13,25,42,.9));border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden;transition:transform .16s,border-color .16s}
.lead-card:active{transform:scale(.985);border-color:var(--line2)}
.lead-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--op)}
.lc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lc-name{font-size:14px;font-weight:700;letter-spacing:.01em}
.lc-tags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.tag{font-size:9.5px;padding:3px 7px;border-radius:5px;background:rgba(255,255,255,.055);color:var(--text2);border:1px solid rgba(255,255,255,.04)}
.tag.op{color:var(--op);background:color-mix(in srgb,var(--op) 14%,transparent);border-color:color-mix(in srgb,var(--op) 30%,transparent)}
.tag.status{color:var(--st);background:color-mix(in srgb,var(--st) 13%,transparent)}
.lc-fee{text-align:right;flex:none}
.lc-fee .f-num{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:-.03em}
.lc-fee .f-unit{font-size:9px;color:var(--muted)}
.lc-meta{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap}
.lc-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.intent-stars{color:var(--amber);letter-spacing:1px;font-size:10px}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty-ico{width:56px;height:56px;margin:0 auto 16px;border-radius:18px;border:1px dashed var(--line2);display:grid;place-items:center;color:var(--faint)}
.empty-ico svg{width:26px;height:26px}
.empty p{font-size:12px;margin:0 0 4px;color:var(--text2)}
.empty span{font-size:10.5px}
.list-count{font-size:10.5px;color:var(--muted);margin:2px 2px 11px;font-family:var(--mono)}

/* 表单 */
.form-sec{margin-bottom:12px}
.form-label{font-size:11.5px;font-weight:700;color:var(--text2);margin:0 0 9px 2px;display:flex;align-items:center;gap:7px;letter-spacing:.03em}
.form-label .req{color:var(--red);font-size:12px}
.form-label .idx{font-family:var(--mono);font-size:9px;color:var(--cyan);border:1px solid rgba(55,225,192,.28);padding:2px 5px;border-radius:4px;letter-spacing:.06em}
.field{background:rgba(8,17,30,.6);border:1px solid var(--line);border-radius:11px;padding:0 13px;height:46px;display:flex;align-items:center;gap:10px;transition:border-color .18s,background .18s}
.field:focus-within{border-color:var(--blue);background:rgba(61,139,255,.06)}
.field .fl{font-size:11px;color:var(--muted);white-space:nowrap;min-width:62px}
.field input{font-size:13px}
.field input::placeholder{color:var(--faint)}
.field .suffix{font-size:11px;color:var(--muted);flex:none}
.field.err{border-color:var(--red)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field-stack{display:flex;flex-direction:column;gap:9px}
textarea.note{background:rgba(8,17,30,.6);border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:12.5px;resize:none;height:76px;line-height:1.6}
textarea.note:focus{border-color:var(--blue)}
textarea.note::placeholder{color:var(--faint)}

.opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt-grid.g2{grid-template-columns:repeat(2,1fr)}
.opt-grid.g4{grid-template-columns:repeat(2,1fr)}
.opt{border:1px solid var(--line);background:rgba(8,17,30,.55);border-radius:11px;padding:11px 6px;text-align:center;font-size:11.5px;color:var(--text2);transition:.18s;position:relative}
.opt:active{transform:scale(.96)}
.opt.on{border-color:var(--blue);background:rgba(61,139,255,.13);color:#CFE1FF;font-weight:700;box-shadow:inset 0 0 0 1px rgba(61,139,255,.2)}
.opt .o-ico{font-size:17px;display:block;margin-bottom:5px;line-height:1}
.opt .o-sub{display:block;font-size:9px;color:var(--muted);margin-top:3px;font-weight:400}
.op-opt{display:flex;align-items:center;gap:9px;padding:12px 10px;border-radius:11px;border:1px solid var(--line);background:rgba(8,17,30,.55);font-size:12px;color:var(--text2);transition:.18s}
.op-opt:active{transform:scale(.97)}
.op-opt .op-dot{width:9px;height:9px;border-radius:50%;background:var(--opc);flex:none;box-shadow:0 0 10px var(--opc)}
.op-opt.on{border-color:var(--opc);background:color-mix(in srgb,var(--opc) 13%,transparent);color:#fff;font-weight:700}
.op-opt .op-check{margin-left:auto;font-size:11px;opacity:0}
.op-opt.on .op-check{opacity:1;color:var(--opc)}

/* 地图打卡 */
.map-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.map-top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.map-src{display:flex;gap:6px}
.map-src button{font-size:10px;padding:5px 9px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.map-src button.on{color:var(--cyan);border-color:rgba(55,225,192,.4);background:rgba(55,225,192,.09);font-weight:700}
.map-status{font-family:var(--mono);font-size:9.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.map-status.live{color:var(--cyan)}
.map-status i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.map-canvas{position:relative;height:172px;overflow:hidden;background:#0C1A2B;cursor:crosshair}
.map-canvas svg.map-svg{position:absolute;inset:0;width:100%;height:100%}
.map-pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);transition:left .35s cubic-bezier(.2,.8,.25,1),top .35s cubic-bezier(.2,.8,.25,1);pointer-events:none;z-index:3}
.pin-pulse{position:absolute;left:50%;top:50%;width:70px;height:70px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(61,139,255,.28),transparent 68%);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.pin-body{width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:linear-gradient(140deg,var(--blue2),var(--blue));border:2px solid #DCEBFF;box-shadow:0 4px 14px rgba(61,139,255,.6);display:grid;place-items:center}
.pin-body i{width:8px;height:8px;background:#fff;border-radius:50%}
.map-hint{position:absolute;left:10px;bottom:9px;font-size:9px;color:rgba(210,230,255,.55);background:rgba(4,12,22,.62);padding:4px 8px;border-radius:5px;z-index:3}
.map-attr{position:absolute;right:8px;bottom:8px;font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:rgba(190,215,245,.42);z-index:3}
.map-info{padding:11px 12px;display:flex;align-items:center;gap:10px}
.map-coord{flex:1;min-width:0}
.map-coord .mc-main{font-size:11.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-coord .mc-sub{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:4px}
.map-btn{flex:none;font-size:10.5px;font-weight:700;color:var(--blue2);background:rgba(61,139,255,.13);border:1px solid rgba(61,139,255,.34);border-radius:8px;padding:9px 11px;display:flex;align-items:center;gap:5px}
.map-btn:active{transform:scale(.95)}
.map-btn svg{width:12px;height:12px}
.addr-field{margin:0 12px 12px;background:rgba(8,17,30,.6);border:1px solid var(--line);border-radius:9px;height:40px;display:flex;align-items:center;gap:8px;padding:0 11px}
.addr-field svg{width:13px;height:13px;color:var(--muted);flex:none}
.addr-field input{font-size:11.5px}
.addr-field input::placeholder{color:var(--faint)}

/* 提交栏 */
#view-add{padding-bottom:172px}
.submit-bar{display:none;position:absolute;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:15;
  padding:14px 16px 14px;gap:9px;background:linear-gradient(180deg,rgba(7,13,24,0),rgba(7,13,24,.93) 16%,#070D18 54%);}
.app-shell.add-mode .submit-bar{display:flex}
.btn-primary{flex:1;height:48px;border-radius:12px;background:linear-gradient(135deg,#4A93FF,#2169DE);color:#fff;font-size:14px;font-weight:700;letter-spacing:.06em;box-shadow:0 8px 24px rgba(45,110,230,.36);display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{width:52px;flex:none;border-radius:12px;border:1px solid var(--line);color:var(--text2);font-size:11px}
.btn-ghost:active{transform:scale(.96)}
.btn-line{width:100%;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--text2);font-size:12.5px;font-weight:600}
.btn-line:active{transform:scale(.98)}
.btn-danger{color:var(--red);border-color:rgba(255,117,104,.3)}

/* 统计图表 */
.range-tabs{display:flex;gap:6px;background:rgba(8,17,30,.7);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:12px}
.range-tabs button{flex:1;font-size:10.5px;padding:8px 0;border-radius:7px;color:var(--muted);transition:.18s}
.range-tabs button.on{background:rgba(61,139,255,.2);color:#CFE1FF;font-weight:700;box-shadow:inset 0 0 0 1px rgba(61,139,255,.3)}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{width:132px;height:132px;flex:none;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:15;transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.25,1)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center .d-num{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.04em}
.donut-center .d-label{font-size:9.5px;color:var(--muted);margin-top:3px}
.donut-legend{flex:1;min-width:0}
.dl-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:10.5px;border-bottom:1px dashed rgba(126,170,235,.09)}
.dl-row:last-child{border-bottom:0}
.dl-row .dl-name{flex:1;color:var(--text2)}
.dl-row .dl-val{font-family:var(--mono);font-weight:700}

  function donutHtml(arr, total) {
    const R = 54, C = 2 * Math.PI * R;
    let offset = 0, segs = '';
    const data = opStats(arr);
    data.forEach(d => {
      if (!d.count || !total) return;
      const len = d.count / total * C;
      segs += '<circle cx="66" cy="66" r="' + R + '" stroke="' + d.color + '" stroke-dasharray="' + Math.max(0, len - 3) + ' ' + (C - len + 3) + '" stroke-dashoffset="' + (-offset) + '" stroke-linecap="butt"/>';
      offset += len;
    });
    if (!total) segs = '<circle cx="66" cy="66" r="' + R + '" stroke="rgba(126,170,235,.15)" stroke-dasharray="' + C + ' 0"/>';
    const rows = data.map(d => '<div class="dl-row"><span class="legend-dot" style="background:' + d.color + '"></span>' +
      '<span class="dl-name">' + d.name + '</span><span class="dl-val" style="color:' + d.color + '">' + d.count + '</span>' +
      '<span class="dl-pct">' + pct(d.count, total) + '%</span></div>').join('');
    return '<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 132 132">' + segs + '</svg>' +
      '<div class="donut-center"><div class="d-num">' + total + '</div><div class="d-label">条线索</div></div></div>' +
      '<div class="donut-legend">' + rows + '</div></div>';
  }

  /* ---------- 地图 SVG ---------- */
  function mapSvg(seed) {
    const s = seed || 1;
    let blocks = '';
    for (let i = 0; i < 26; i++) {
      const x = ((i * 71 + s * 13) % 300), y = ((i * 47 + s * 29) % 150);
      const w = 24 + ((i * 17) % 40), hh = 16 + ((i * 11) % 26);
      const fill = ['#12263E', '#142B45', '#112238', '#16304C'][i % 4];
      blocks += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + hh + '" rx="2" fill="' + fill + '" opacity=".85"/>';
    }
    let roads = '';
    [24, 62, 108, 148].forEach((y, i) => { roads += '<path d="M0 ' + y + ' H320" stroke="#1E3A5C" stroke-width="' + (i % 2 ? 4 : 7) + '" opacity=".8"/>'; });
    [42, 118, 196, 268].forEach((x, i) => { roads += '<path d="M' + x + ' 0 V180" stroke="#1E3A5C" stroke-width="' + (i % 2 ? 4 : 7) + '" opacity=".8"/>'; });
    [24, 62, 108, 148].forEach(y => { roads += '<path d="M0 ' + y + ' H320" stroke="#2C5079" stroke-width=".8" stroke-dasharray="7 9" opacity=".8"/>'; });
    [42, 118, 196, 268].forEach(x => { roads += '<path d="M' + x + ' 0 V180" stroke="#2C5079" stroke-width=".8" stroke-dasharray="7 9" opacity=".8"/>'; });
    return '<svg class="map-svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">' +
      '<rect width="320" height="180" fill="#0B1C2F"/>' + blocks +
      '<path d="M236 0 Q252 46 236 92 T244 180 L320 180 L320 0 Z" fill="#0E3350" opacity=".8"/>' +
      '<path d="M8 132 Q46 120 78 140 T140 150 L140 180 L0 180 Z" fill="#123A34" opacity=".6"/>' +

  }

  /* ---------- 导航 / 分享 / 商机口令 ---------- */
  /* GPS 是 WGS84，高德用 GCJ02，百度用 BD09 —— 唤起前逐级换算，避免落点偏移 */
  function outOfChina(lat, lng) { return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271; }
  function tLat(x, y) {
    let r = -100 + 2 * x + 3 * y + .2 * y * y + .1 * x * y + .2 * Math.sqrt(Math.abs(x));
    r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
    r += (20 * Math.sin(y * Math.PI) + 40 * Math.sin(y / 3 * Math.PI)) * 2 / 3;
    r += (160 * Math.sin(y / 12 * Math.PI) + 320 * Math.sin(y * Math.PI / 30)) * 2 / 3;
    return r;
  }
  function tLng(x, y) {
    let r = 300 + x + 2 * y + .1 * x * x + .1 * x * y + .1 * Math.sqrt(Math.abs(x));
    r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
    r += (20 * Math.sin(x * Math.PI) + 40 * Math.sin(x / 3 * Math.PI)) * 2 / 3;
    r += (150 * Math.sin(x / 12 * Math.PI) + 300 * Math.sin(x / 30 * Math.PI)) * 2 / 3;
    return r;
  }
  function wgs2gcj(lat, lng) {
    if (outOfChina(lat, lng)) return { lat: lat, lng: lng };
    const a = 6378245.0, ee = 0.00669342162296594323;
    let dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
    const rad = lat / 180 * Math.PI;
    let magic = Math.sin(rad); magic = 1 - ee * magic * magic;
    const sq = Math.sqrt(magic);
    dLat = dLat * 180 / ((a * (1 - ee)) / (magic * sq) * Math.PI);
    dLng = dLng * 180 / (a / sq * Math.cos(rad) * Math.PI);
    return { lat: lat + dLat, lng: lng + dLng };
  }
  function gcj2bd(lat, lng) {
    const x = lng, y = lat;
    const z = Math.sqrt(x * x + y * y) + 0.00002 * Math.sin(y * Math.PI);
    const th = Math.atan2(y, x) + 0.000003 * Math.cos(x * Math.PI);
    return { lat: z * Math.sin(th) + 0.006, lng: z * Math.cos(th) + 0.0065 };
  }
  function coordsOf(l) {
    const la = Number(l.location && l.location.lat), ln = Number(l.location && l.location.lng);
    if (!isFinite(la) || !isFinite(ln) || la <= 0 || ln <= 0) return null;
    const g = wgs2gcj(la, ln);
    return { gcj: g, bd: gcj2bd(g.lat, g.lng) };
  }
  function cleanName(s) { return String(s == null ? '' : s).replace(/[|&#?]/g, ' '); }
  function navUrls(l) {

    const addr = cleanName(l.location && l.location.address) || name;
    const c = coordsOf(l);

      amapSearch: 'https://uri.amap.com/search?keyword=' + encodeURIComponent(addr) + '&city=' + encodeURIComponent('遵义') + '&src=gridops&callnative=1',
      bmapSearch: 'https://api.map.baidu.com/geocoder?address=' + encodeURIComponent(addr) + '&output=html&src=webapp.gridops'
    };
    if (c) {

  function launchMap(nav, key, label) {

  /* 商机口令：把一条线索压成可粘贴的文本，同事导入后即可存入本机 */
  function b64enc(str) {

    const addr = (l.location && l.location.address) || '';
    if (!addr) { toast('该线索暂无地址', 'err'); return; }
    const done = ok => toast(ok ? '客户地址已复制，可粘贴到高德 / 百度地图' : '复制失败，请手动长按选择', ok ? 'ok' : 'err');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(addr).then(() => done(true)).catch(() => done(copyFallback(addr)));
    } else done(copyFallback(addr));
  }

  /* ---------- 详情 Sheet ---------- */
  function openDetail(id) {
    const l = state.leads.find(x => x.id === id); if (!l) return;
    const op = OPS[l.operator], st = STATUS[l.status], pl = PLANS[l.plan];
    let h = '<div class="sheet-handle"></div><div class="sheet-title">' + esc(l.name) + '</div>' +
      '<div class="sheet-sub">建档 ' + fmtFull(l.createdAt) + ' · 编号 ' + esc(l.id) + '</div>';
    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">' +
      '<span class="tag op" style="--op:' + op.color + ';color:' + op.color + '">● ' + op.name + '</span>' +
      '<span class="tag status" style="--st:' + st.color + ';color:' + st.color + '">' + st.name + '</span>' +
      '<span class="tag">' + CTYPES[l.customerType].name + '</span>' +
      '<span class="tag">' + pl.name + '</span></div>';

    h += '<div class="detail-map">' + mapSvg(l.location.source === 'amap' ? 1 : 6) +
      '<div class="map-pin" style="left:' + (l.location.px || 50) + '%;top:' + (l.location.py || 50) + '%"><div class="pin-pulse"></div><div class="pin-body"><i></i></div></div>' +
      '<div class="map-float"><span class="mf-tag">' + (l.location.source === 'amap' ? '高德' : '百度') + ' 已打卡</span>' +
      '<button data-act="nav" data-v="amap" data-id="' + esc(l.id) + '">高德</button>' +
      '<button data-act="nav" data-v="bmap" data-id="' + esc(l.id) + '">百度</button></div>' +
      '<div class="map-attr">' + (l.location.source === 'amap' ? 'AMAP' : 'BAIDU MAP') + '</div></div>';

    h += '<div class="detail-grid">' +
      dg('当前套餐', esc(l.planName || '—'), true) +
      dg('当前月资费', '<span style="color:var(--amber)">' + money(l.fee) + '</span>') +
      dg('联系电话', '<a href="tel:' + esc(l.phone) + '" style="color:var(--blue2);text-decoration:none">' + esc(l.phone) + '</a>') +
      dg('打卡位置', esc(l.location.address || '—'), true) +
      dg('经纬度', l.location.lat.toFixed(5) + ', ' + l.location.lng.toFixed(5), true) +
      dg('年龄 / 性别', (l.age || '—') + ' 岁 · ' + GENDER[l.gender]) +
      dg('消费水平', SPEND[l.spendLevel]) +
      dg('消费意愿', '<span style="color:var(--amber)">' + INTENT[l.intent] + '</span>') +
      dg('客户类型', CTYPES[l.customerType].name) +
      dg('跟进计划', pl.name) +
      '</div>';
    if (l.note) h += '<div class="follow-log"><div class="tiny" style="margin-bottom:6px">走访备注</div><div style="font-size:11.5px;line-height:1.7;color:var(--text2)">' + esc(l.note) + '</div></div>';

    h += '<div class="form-label" style="margin-top:4px">更新跟进状态</div><div class="status-picker">' +
      Object.keys(STATUS).map(k => '<button class="chip ' + (l.status === k ? 'on' : '') + '" data-act="setStatus" data-id="' + esc(l.id) + '" data-v="' + k + '">' + STATUS[k].name + '</button>').join('') + '</div>';

    h += '<div class="form-label">跟进记录</div><div class="follow-log">' +
      (l.followUps && l.followUps.length ? l.followUps.slice().reverse().map(f =>
        '<div class="fl-item"><span>' + fmtDate(f.at, true) + '</span>' + esc(f.text) + '</div>').join('') :
        '<div class="tiny">暂无跟进记录</div>') + '</div>' +
      '<div class="field" style="margin-bottom:12px"><span class="fl">新增记录</span><input id="followText" placeholder="如：已上门讲解移动套餐"><button data-act="addFollow" data-id="' + esc(l.id) + '" style="color:var(--blue2);font-size:11px;font-weight:700;white-space:nowrap">添加</button></div>';

    h += '<div class="detail-actions">' +
      '<a class="act-btn" href="tel:' + esc(l.phone) + '">' + svg('phone', 16) + '<span>拨打客户</span></a>' +
      '<button class="act-btn nav-main" data-act="navQuick" data-id="' + esc(l.id) + '">' + svg('pin', 16) +
        '<span>一键导航 · ' + NAV_SHORT[navProvider()] + '</span>' +
        '<span class="nav-caret" data-act="toggleNav" aria-label="切换地图">▾</span></button>' +
      '<button class="act-btn primary" data-act="share" data-id="' + esc(l.id) + '">' + svg('arrow', 16) + '<span>分享商机</span></button></div>';

    const approx = l.location.gpsReal === false || (l.location.accuracy > 80);
    const idAttr = 'data-id="' + esc(l.id) + '"';
    h += '<div class="nav-choices" id="navChoices">' +
      (approx ? '<div class="nc-warn">该打卡点未取到真实 GPS（示意 / 低精度定位），坐标仅供示意。建议用下方「按地址导航」或复制详细地址，落点更准确。</div>' : '') +
      '<div class="nc-title">选择地图前往「' + esc(l.location.address || '客户位置') + '」<span class="nc-default">当前默认 ' + NAV_SHORT[navProvider()] + '</span></div>' +
      '<div class="nc-grid">' +
      (approx
        ? '<button data-act="nav" data-v="amapSearch" ' + idAttr + '>高德 · 按地址导航 ✓</button>' +
          '<button data-act="nav" data-v="bmapSearch" ' + idAttr + '>百度 · 按地址导航 ✓</button>' +
          '<button data-act="nav" data-v="amap" ' + idAttr + '>高德 · 按坐标导航</button>' +
          '<button data-act="nav" data-v="bmap" ' + idAttr + '>百度 · 按坐标导航</button>'
        : '<button data-act="nav" data-v="amap" ' + idAttr + '>高德地图 · 驾车导航</button>' +
          '<button data-act="nav" data-v="bmap" ' + idAttr + '>百度地图 · 驾车导航</button>' +
          '<button data-act="nav" data-v="amapSearch" ' + idAttr + '>高德 · 按地址搜索</button>' +
          '<button data-act="nav" data-v="bmapSearch" ' + idAttr + '>百度 · 按地址搜索</button>') +
      '</div>' +
      '<button class="nc-copy" data-act="copyAddr" data-id="' + esc(l.id) + '">' + svg('pin', 12) + ' 复制详细地址（粘贴到任意地图 App）</button>' +
      '<div class="tiny">已改为直接唤起地图 App（跳过网页中转页），点击后约 1 秒内启动，装了地图 App 无需等网页加载；未安装则自动回落网页版。点上方「一键导航」右上角 ▾ 可切换默认地图，选过的会记住。</div></div>';

    h += '<div class="detail-foot"><button class="btn-line btn-danger" data-act="deleteLead" data-id="' + esc(l.id) + '">删除本条线索</button></div>';

    $('#sheet').innerHTML = h;
    openSheet();
  }
  function dg(label, val, full) {
    return '<div class="dg-item ' + (full ? 'full' : '') + '"><div class="dg-l">' + label + '</div><div class="dg-v">' + val + '</div></div>';
  }
  function openSheet() { $('#sheet').classList.add('show'); $('#sheetMask').classList.add('show'); }
  function closeSheet() { $('#sheet').classList.remove('show'); $('#sheetMask').classList.remove('show'); }

  /* ---------- 表单交互 ---------- */
  function updateOptGroup(group, val) {
    $$('[data-opt="' + group + '"]', $('#view-add')).forEach(b => b.classList.toggle('on', b.dataset.v === val));
  }
  function locate() {
    const btn = $('#btnLocate'), st = $('#mapStatus');
    if (btn) { btn.innerHTML = svg('refresh', 12) + ' 定位中…'; }
    const done = (lat, lng, acc, real) => {
      const f = state.form, now = new Date().toISOString();
      f.location.lat = +lat.toFixed(5); f.location.lng = +lng.toFixed(5);
      f.location.accuracy = acc; f.location.gpsReal = real;
      f.location.checked = true; f.location.checkedAt = now;
      if (!f.location.address) f.location.address = real ? '遵义市凤冈县 · GPS 定位点（请补充详细地址）' : '遵义市凤冈县 · 示意定位点（请补充详细地址）';
      renderAdd();
      toast(real
        ? (acc > 50 ? '定位成功但精度约 ±' + acc + 'm，请补充详细地址' : '定位成功，精度约 ±' + acc + 'm，已记录打卡坐标')
        : '未取到真实 GPS，已用示意点，请补充详细地址用于导航', (real && acc > 50) ? 'err' : 'ok');
    };
    if (navigator.geolocation) {
      let settled = false;
      // 给 GPS 充足时间；兜底计时器必须晚于 timeout，避免真实定位还没返回就先落示意点
      const timer = setTimeout(() => { if (!settled) { settled = true; done(BASE.lat + (Math.random() - .5) * .01, BASE.lng + (Math.random() - .5) * .01, 20, false); } }, 13000);
      navigator.geolocation.getCurrentPosition(
        p => { if (settled) return; settled = true; clearTimeout(timer); done(p.coords.latitude, p.coords.longitude, Math.round(p.coords.accuracy), true); },
        () => { if (settled) return; settled = true; clearTimeout(timer); done(BASE.lat, BASE.lng, 20, false); },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    } else { done(BASE.lat, BASE.lng, 20, false); }
  }
  function handleMapClick(e) {
    const canvas = $('#mapCanvas'); if (!canvas) return;
    const r = canvas.getBoundingClientRect();
    const px = clamp((e.clientX - r.left) / r.width * 100, 6, 94);
    const py = clamp((e.clientY - r.top) / r.height * 100, 12, 92);
    const f = state.form;
    // 示意图与真实地理坐标没有对应关系，点选只调整标记位置，绝不再改写经纬度
    f.location.px = +px.toFixed(1); f.location.py = +py.toFixed(1);
    f.location.checked = true;
    if (!f.location.checkedAt) f.location.checkedAt = new Date().toISOString();
    const p = $('#mapPin'); if (p) { p.style.left = px + '%'; p.style.top = py + '%'; }
    const sub = $('#mcSub'), status = $('#mapStatus');
    if (sub) sub.textContent = f.location.lat.toFixed(5) + ', ' + f.location.lng.toFixed(5) +
      (f.location.gpsReal ? ' · 精度 ±' + (f.location.accuracy || 0) + 'm · GPS 坐标' : ' · 示意坐标，请补充详细地址');
    if (status) { status.classList.add('live'); status.innerHTML = '<i></i>已打卡'; }
    toast('标记位置已微调；真实坐标以 GPS 为准，导航请用详细地址');
  }
  function submitForm() {
    const f = state.form;
    const errs = [];
    if (!f.name.trim()) errs.push('客户名称');
    if (!/^1\d{10}$/.test(f.phone.trim())) errs.push('11 位联系电话');
    if (!f.location.checked) errs.push('地图打卡定位');
    if (f.fee !== '' && (isNaN(+f.fee) || +f.fee < 0)) errs.push('套餐金额');
    if (errs.length) { toast('请完成：' + errs.join('、'), 'err'); return; }
    const lead = {
      id: uid(), createdAt: new Date().toISOString(),
      name: f.name.trim(), customerType: f.customerType, operator: f.operator,
      planName: f.planName.trim(), fee: +f.fee || 0,
      phone: f.phone.trim(), age: +f.age || null, gender: f.gender,
      spendLevel: f.spendLevel, intent: f.intent, plan: f.plan, note: f.note.trim(),
      location: { ...f.location }, status: 'pending', followUps: []
    };
    state.leads.unshift(lead); save();
    state.form = blankForm();
    state.filter.status = 'all'; state.filter.operator = 'all'; state.filter.ctype = 'all'; state.filter.q = '';
    renderAllViews();
    switchTab('leads');
    toast('线索已建档，已加入营销计划', 'ok');
  }
  function exportCSV() {
    if (!state.leads.length) { toast('暂无数据可导出', 'err'); return; }
    const head = ['编号','录入时间','客户名称','客户类型','在用运营商','套餐名称','月资费(元)','联系电话','年龄','性别','消费水平','消费意愿','打卡地址','经度','纬度','定位精度(m)','地图源','打卡时间','跟进状态','营销计划','走访备注'];
    const lines = state.leads.map(l => [l.id, fmtFull(l.createdAt), l.name, CTYPES[l.customerType].name,
      OPS[l.operator].name, l.planName, l.fee, l.phone, l.age || '', GENDER[l.gender], SPEND[l.spendLevel],
      INTENT[l.intent], l.location.address, l.location.lat, l.location.lng, l.location.accuracy || '',
      l.location.source === 'amap' ? '高德地图' : '百度地图', l.location.checkedAt ? fmtFull(l.location.checkedAt) : '',
      STATUS[l.status].name, PLANS[l.plan].name, l.note || ''
    ].map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(','));
    const blob = new Blob(['\uFEFF' + head.join(',') + '\n' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = '宽带商机线索_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('已导出 ' + state.leads.length + ' 条线索', 'ok');
  }

  /* ---------- 视图切换 ---------- */
  const RENDER = { home: renderHome, leads: renderLeads, add: renderAdd, stats: renderStats, profile: renderProfile };
  function renderView(name) { if (RENDER[name]) RENDER[name](); }
  function renderAllViews() { Object.keys(RENDER).forEach(renderView); }
  function switchTab(tab) {
    if (!RENDER[tab]) tab = 'home';
    state.tab = tab;
    try { history.replaceState(null, '', '#' + tab); } catch (e) {}
    if (tab !== 'profile') state.confirmClear = false;
    $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + tab));
    $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    $('.tab-fab').classList.toggle('on', tab === 'add');
    $('.app-shell').classList.toggle('add-mode', tab === 'add');
    renderView(tab);
    $('#appMain').scrollTop = 0;
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', function (e) {
    const t = e.target.closest('[data-act]');
    if (!t) {
      if (e.target.closest('#sheetMask')) closeSheet();
      if (e.target.id === 'mapCanvas' || (e.target.closest('#mapCanvas') && !e.target.closest('[data-act]'))) handleMapClick(e);
      return;
    }
    const a = t.dataset.act, v = t.dataset.v, id = t.dataset.id;
    switch (a) {
      case 'go': switchTab(t.dataset.tab); break;
      case 'detail': openDetail(id); break;
      case 'toggleFilter': state.filter.showPanel = !state.filter.showPanel; renderView('leads'); break;
      case 'fStatus': state.filter.status = v; renderView('leads'); break;
      case 'fOp': state.filter.operator = v; renderView('leads'); break;
      case 'fCtype': state.filter.ctype = v; renderView('leads'); break;
      case 'fSort': state.filter.sort = v; renderView('leads'); break;
      case 'opt': state.form[t.dataset.opt] = v; updateOptGroup(t.dataset.opt, v); break;
      case 'mapSrc':
        state.form.location.source = v; renderView('add'); break;
      case 'locate': locate(); break;
      case 'resetForm': state.form = blankForm(); renderView('add'); toast('表单已重置'); break;
      case 'submit': submitForm(); break;
      case 'range': state.range = v; renderView('stats'); break;
      case 'applyInterval': {
        const vals = $$('.iv-in').map(i => +i.value).filter(n => !isNaN(n) && n > 0).sort((x, y) => x - y);
        if (!vals.length || vals.length !== $$('.iv-in').length || new Set(vals).size !== vals.length) { toast('请输入有效且递增的区间边界', 'err'); return; }
        state.intervals = vals; saveSettings(); renderView('stats'); toast('资费区间已更新', 'ok'); break;
      }
      case 'setStatus': {
        const l = state.leads.find(x => x.id === id); if (!l) return;
        l.status = v; if (!l.followUps) l.followUps = [];
        l.followUps.push({ at: new Date().toISOString(), text: '状态更新为「' + STATUS[v].name + '」' });
        save(); renderAllViews(); openDetail(id); toast('跟进状态已更新', 'ok'); break;
      }
      case 'addFollow': {
        const inp = $('#followText'), l = state.leads.find(x => x.id === id);
        if (!l || !inp || !inp.value.trim()) { toast('请输入跟进内容', 'err'); return; }
        if (!l.followUps) l.followUps = [];
        l.followUps.push({ at: new Date().toISOString(), text: inp.value.trim() });
        if (l.status === 'pending') l.status = 'following';
        save(); renderAllViews(); openDetail(id); toast('已添加跟进记录', 'ok'); break;
      }
      case 'deleteLead': {
        const l = state.leads.find(x => x.id === id); if (!l) return;
        state.leads = state.leads.filter(x => x.id !== id); save();
        closeSheet(); renderAllViews(); toast('线索已删除'); break;
      }
      case 'nav': doNav(id, v || 'amap'); break;
      case 'navQuick': navQuick(id); break;
      case 'share': shareLead(id); break;
      case 'toggleNav': { const box = $('#navChoices'); if (box) box.classList.toggle('show'); break; }
      case 'navForm': navFormLocation(v); break;
      case 'importLead': openImportSheet(); break;
      case 'doImport': doImport(); break;
      case 'closeSheet': closeSheet(); break;
      case 'shareTemplate': shareTemplate(); break;
      case 'confirmFresh': applyFresh(); break;
      case 'copyAddr': copyLeadAddr(id); break;
      case 'export': exportCSV(); break;
      case 'backupAll': backupAll(); break;
      case 'restore':
        state.leads = seedLeads(); save(); renderAllViews(); toast('已恢复示例数据', 'ok'); break;
      case 'clear':
        if (!state.confirmClear) { state.confirmClear = true; renderView('profile'); toast('再次点击确认清空'); }
        else { state.leads = []; state.confirmClear = false; save(); renderAllViews(); toast('已清空全部线索'); }
        break;
    }
  });

  // tabbar
  $$('.tab, .tab-fab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

  // 表单输入（委托，保持焦点）
  document.addEventListener('input', function (e) {
    const el = e.target;
    if (el.id === 'leadSearch') { state.filter.q = el.value; refreshLeadList(); return; }
    if (el.dataset && el.dataset.f) {
      const k = el.dataset.f;
      if (k === 'address') state.form.location.address = el.value;
      else state.form[k] = el.value;
      if (k === 'address') { const m = $('#mcMain'); if (m) m.textContent = el.value || '尚未补充详细地址'; }
    }
  });
  document.addEventListener('change', function (e) {
    const el = e.target;
    if (el.dataset && el.dataset.f && el.tagName === 'SELECT') state.form[el.dataset.f] = el.value;
  });

  /* ---------- 启动 ---------- */
  function tick() {
    const d = new Date(); $('#sbTime').textContent = d.getHours() + ':' + pad(d.getMinutes());
  }
  tick(); setInterval(tick, 30000);
  renderAllViews();
  const initTab = (location.hash || '').replace('#', '');
  switchTab(RENDER[initTab] ? initTab : 'home');
  window.addEventListener('hashchange', () => {
    const t = (location.hash || '').replace('#', '');
    if (RENDER[t] && t !== state.tab) switchTab(t);
  });
  handleFreshTemplate(); // 同事打开 #fresh 空白模板链接时，本机自动变成空库
  // 首屏引导
  if (!initTab) setTimeout(() => toast('点击中间 ＋ 开始录入线索商机'), 900);


})();

</script>
</body>
</html>
